; PlatformIO Project Configuration File
;
; Vuesp LCD 2432S024C — ESP32-2432S024C, 2.4" ILI9341, CST820 touch, SD.
; Two environments: ILI9341 (default) and ST7789 (if the panel is different).

[common]
firmware_version = '{5, 0, 2}'
device_name = '"vuesp.lcd-2432"'

[platformio]
build_dir = build
default_envs = esp32

[lcd]
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bodmer/TJpg_Decoder@^1.1.0
    ESP32Async/AsyncTCP@3.5.0
    ESP32Async/ESPAsyncWebServer@3.12.1
    paulstoffregen/OneWire@2.3.8
build_flags =
    -D USER_SETUP_LOADED=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=27
    -D USE_HSPI_PORT=1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -D SUPPORT_TRANSACTIONS=1

[env:esp32]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
board_build.partitions = default.csv
build_src_filter = +<*> -<tests/*>
lib_deps = ${lcd.lib_deps}
build_flags =
    ${lcd.build_flags}
    -D ILI9341_DRIVER=1
    -D DEF_DEVICE_FIRMWARE=${common.firmware_version}
    -D DEF_DEVICE_NAME=${common.device_name}
    -D CURRENT_TIME=$UNIX_TIME
    -D DEF_BOARD=2

[env:esp32-st7789]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
board_build.partitions = default.csv
build_src_filter = +<*> -<tests/*>
lib_deps = ${lcd.lib_deps}
build_flags =
    ${lcd.build_flags}
    -D ST7789_DRIVER=1
    -D DEF_DEVICE_FIRMWARE=${common.firmware_version}
    -D DEF_DEVICE_NAME=${common.device_name}
    -D CURRENT_TIME=$UNIX_TIME
    -D DEF_BOARD=2
